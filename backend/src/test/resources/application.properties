# Isolated disposable test MySQL only. Start using scripts/test.ps1.
spring.application.name=smartcrm-l8-tests
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://127.0.0.1:3307/smartcrm_l8_test?connectionTimeZone=Asia/Ho_Chi_Minh}
spring.datasource.username=${TEST_DB_USER:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.security.service-key=test-only-service-key-00000000000000000000
app.security.jwt-secret=test-only-jwt-secret-0000000000000000000000
app.security.bootstrap-enabled=true
app.security.bootstrap-password=test-only-password-000000
app.survey.public-base-url=http://localhost:5173/khao-sat
app.survey.scheduler-enabled=false
app.gateway.simulate-failure=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
