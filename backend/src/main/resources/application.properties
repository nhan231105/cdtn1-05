
# Application
spring.application.name=smartcrm-l8
server.port=8080

# MySQL connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/smartcrm_l8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA - Flyway controls database schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# Public survey URL - local development
app.survey.public-base-url=http://localhost:5173/khao-sat


# Internal service authentication
app.security.service-key=${SERVICE_API_KEY}

