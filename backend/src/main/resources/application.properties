
# Application
spring.application.name=smartcrm-l8
server.port=8080

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smartcrm_l8?connectionTimeZone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA - Flyway controls database schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# Public survey URL - local development
app.survey.public-base-url=${SURVEY_PUBLIC_BASE_URL:http://localhost:5173/khao-sat}


# Internal service authentication
app.security.service-key=${SERVICE_API_KEY}
app.security.jwt-secret=${JWT_SECRET}
app.security.bootstrap-password=${BOOTSTRAP_PASSWORD:}
app.security.bootstrap-enabled=${BOOTSTRAP_ENABLED:false}
app.gateway.simulate-failure=${GATEWAY_SIMULATE_FAILURE:false}
app.survey.expiry-days=${SURVEY_EXPIRY_DAYS:7}
app.survey.scheduler-enabled=${SURVEY_SCHEDULER_ENABLED:true}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

